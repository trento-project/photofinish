name: Release binary

on:
  push:
    tags:        
      - v*

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      run: cargo build --release
    - name: Compress action step
      uses: a7ul/tar-action@ed9cbd44fc9276db29ea2fb1f8adf3d7e0691589 # v1.2.0
      id: compress
      with:
        command: c
        cwd: ./target/release/
        files: |
          ./photofinish
        outPath: photofinish_linux_x86_64.tar.gz
    - name: Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        files: ./photofinish_linux_x86_64.tar.gz
